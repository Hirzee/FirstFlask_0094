<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h2>Formulir Data Diri</h2>
            <p>Silakan lengkapi informasi di bawah ini dengan benar.</p>
        </div>

        <div class="card-body">
            <form action="/" method="POST">
                <!-- Input Nama -->
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        <input type="text" id="nama" name="nama" placeholder="Contoh: Budi Santoso" required>
                    </div>
                </div>

                <!-- Input Email -->
                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                        <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                    </div>
                </div>

                <!-- Input Telepon -->
                <div class="form-group">
                    <label for="telepon">Nomor Telepon</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                        </svg>
                        <input type="tel" id="telepon" name="telepon" placeholder="0812-3456-7890" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Simpan Data</button>
            </form>

            <!-- Kartu Hasil Parsing -->
            {% if data %}
                <div class="result-card">
                    <div class="result-header">
                        <svg class="status-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span>Data Berhasil Diparsing</span>
                    </div>
                    <div class="result-details">
                        <div class="detail-row">
                            <span class="detail-label">Nama:</span>
                            <span class="detail-value">{{ data.nama }}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Email:</span>
                            <span class="detail-value">{{ data.email }}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Telepon:</span>
                            <span class="detail-value">{{ data.telepon }}</span>
                        </div>
                    </div>
                </div>
            {% endif %}

            <!-- Kartu Pesan Error -->
            {% if error %}
                <div class="error-card">
                    <svg class="status-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>{{ error }}</span>
                </div>
            {% endif %}
        </div>
    </div>

</body>
</html>
